<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>화상 화이트보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      width: 400px;
      padding: 36px 32px;
      background: #1e2332;
      border: 1px solid #2d3348;
      border-radius: 16px;
    }
    .icon { font-size: 36px; text-align: center; margin-bottom: 12px; }
    h2 { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .desc { font-size: 12px; color: #8892a4; text-align: center; margin-bottom: 24px; line-height: 1.6; }
    label { font-size: 12px; color: #8892a4; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #3a4055;
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #5b7fff; }
    input::placeholder { color: #3a4055; }
    .buttons { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-local { background: #2d3348; color: #c5cde0; }
    .btn-local:hover { background: #3a4055; }
    .btn-connect { background: #5b7fff; color: #fff; }
    .btn-connect:hover { background: #4a6ef0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🎥</div>
    <h2>화상 화이트보드</h2>
    <p class="desc">
      상대방의 서버 주소가 있으면 입력하세요.<br/>
      비워두면 내 PC에서 서버를 직접 실행합니다.
    </p>
    <label>서버 주소 (선택)</label>
    <input id="url-input" type="text" placeholder="https://xxx.trycloudflare.com" value="https://your-server.up.railway.app" />
    <div class="buttons">
      <button class="btn-local" id="local-btn">내 서버로 시작</button>
      <button class="btn-connect" id="connect-btn">접속하기</button>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('local-btn').addEventListener('click', () => {
      ipcRenderer.send('server-url-selected', '');
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const url = document.getElementById('url-input').value.trim();
      ipcRenderer.send('server-url-selected', url);
    });

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const url = e.target.value.trim();
        ipcRenderer.send('server-url-selected', url);
      }
    });
  </script>
</body>
</html>
